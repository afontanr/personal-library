[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-library"
version = "0.1.0"
description = "API FastAPI con arquitectura hexagonal para integraciones HTTP externas"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.8.0",
    "numpy>=2.0.0",
    "pyzbar>=0.1.9",
    "opencv-python-headless>=4.10.0",
    "av>=14.0.0",
]
scanner = [
    "streamlit>=1.45.0",
    "streamlit-webrtc>=0.47.0",
    "opencv-python-headless>=4.10.0",
    "pyzbar>=0.1.9",
    "av>=14.0.0",
    "numpy>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "B008",  # FastAPI uses Depends() in function argument defaults by design
]
