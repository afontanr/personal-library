<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Biblioteca Personal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('web_static', path='css/styles.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="{{ url_for('book_list') }}" class="site-title">
        <span>Biblioteca</span> Personal
      </a>
      <nav class="header-nav">
        <a href="{{ url_for('book_list') }}">Colección</a>
        <a href="{{ url_for('scan') }}" class="header-nav__scan">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 012-2h2"/>
            <path d="M17 3h2a2 2 0 012 2v2"/>
            <path d="M21 17v2a2 2 0 01-2 2h-2"/>
            <path d="M7 21H5a2 2 0 01-2-2v-2"/>
            <line x1="7" y1="12" x2="17" y2="12"/>
          </svg>
          Escanear
        </a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    Biblioteca Personal &middot; {{ current_year }}
  </footer>

  <dialog id="delete-dialog">
    <div class="dialog-content">
      <h2 class="dialog-title">Eliminar libro</h2>
      <p class="dialog-message" id="delete-dialog-message"></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn--outline" id="delete-dialog-cancel">Cancelar</button>
        <button type="button" class="btn btn--danger" id="delete-dialog-confirm">Eliminar</button>
      </div>
    </div>
  </dialog>

  <script src="{{ url_for('web_static', path='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
