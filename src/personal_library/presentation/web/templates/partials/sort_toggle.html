{% set options = [('defecto', 'Recientes', ''), ('autor', 'Autor', '?orden=autor')] %}
{% if list_route == 'book_list' %}{% set options = options + [('saga', 'Saga', '?orden=saga')] %}{% endif %}
<nav class="sort-toggle" aria-label="Ordenar libros">
  {% for value, label, query in options %}
  {% set active = order == value %}
  <a href="{{ url_for(list_route) }}{{ query }}" class="sort-toggle__option{% if active %} sort-toggle__option--active{% endif %}"{% if active %} aria-current="true"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>
