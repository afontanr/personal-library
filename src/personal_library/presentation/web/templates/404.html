{% extends "base.html" %}

{% block title %}No encontrado — Biblioteca Personal{% endblock %}

{% block content %}
<div class="empty-state">
  <div class="empty-state__icon">&#128214;</div>
  <h2 class="empty-state__title">Libro no encontrado</h2>
  <p class="empty-state__text">No hay ningún libro con ese ISBN en tu colección.</p>
  <a href="{{ url_for('book_list') }}" class="btn btn--primary" style="margin-top: 1.5rem; display: inline-block;">
    Volver a la colección
  </a>
</div>
{% endblock %}
